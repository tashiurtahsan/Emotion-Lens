<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emotion Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#001D39; --c2:#0A4174; --c3:#49769F; --c4:#4E8EA2; --c5:#6EA2B3; --c6:#7BBDE8; --c7:#BDD8E9;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{
  margin:0;min-height:100%;
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--c7);
  background:var(--c1) linear-gradient(180deg,#BDD8E9 0%,#7BBDE8 22%,#5BAFCB 40%,#4A78A0 58%,#0A4174 76%,#001D39 100%) fixed;
}
main{max-width:560px;margin:0 auto;padding:32px 20px 56px}
h1{margin:0;font-size:clamp(34px,8vw,48px);font-weight:800;letter-spacing:-.02em;color:var(--c1);line-height:1}
.by{margin:10px 0 0;font-size:15px;font-weight:600;color:var(--c2)}
.sub{margin:6px 0 0;color:var(--c2);font-size:16px;max-width:36ch;line-height:1.4}

.field{
  margin-top:28px;border-radius:36px;background:var(--c7);
  box-shadow:0 18px 30px -10px rgba(0,29,57,.55),0 2px 0 rgba(255,255,255,.6) inset;
  padding:10px 10px 10px 26px;display:flex;align-items:center;gap:10px;
  transition:transform .25s ease,box-shadow .25s ease;
}
.field:focus-within{transform:translateY(-3px);box-shadow:0 26px 36px -12px rgba(0,29,57,.6),0 2px 0 rgba(255,255,255,.6) inset}
textarea{flex:1;border:0;background:transparent;resize:none;height:56px;padding:17px 0;font:inherit;font-size:17px;color:var(--c1);outline:none;line-height:1.3}
textarea::placeholder{color:var(--c3)}
button{
  flex:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:16px;color:#fff;
  background:var(--c2);border-radius:28px;height:56px;padding:0 24px;
  box-shadow:0 8px 14px -4px rgba(0,29,57,.6),0 2px 0 rgba(255,255,255,.25) inset;
  transition:transform .15s ease,box-shadow .15s ease,background .2s;
}
button:hover{background:var(--c1)}
button:active{transform:translateY(3px);box-shadow:0 2px 4px rgba(0,29,57,.6)}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--c6);outline-offset:2px}

.status{margin:16px 6px 0;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--c7)}
.verdict{font-weight:600;color:#fff}

.stage{margin-top:26px;perspective:1100px}
.card{
  position:relative;height:124px;border-radius:62px;overflow:hidden;
  background:var(--c7);
  box-shadow:0 22px 30px -10px rgba(0,29,57,.65),0 2px 0 rgba(255,255,255,.4) inset;
  transform-style:preserve-3d;
  transition:transform .25s ease-out,background .6s ease;
}
.card .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:62px;background:rgba(255,255,255,.22);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.card .row{position:relative;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:34px;font-weight:800;letter-spacing:-.01em;text-transform:capitalize}
.card #pct{font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.card.dark{color:#fff}.card.light{color:var(--c1)}
.note{margin:28px 6px 0;font-size:13px;color:var(--c7);opacity:.85;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){button{padding:0 16px}.card .row{padding:0 30px;font-size:28px}}
</style>
</head>
<body>
<main>
  <h1>Emotion Lens</h1>
  <p class="by">Model by Tashiur Tahsan</p>
  <p class="sub">Write a sentence and see which feeling it carries.</p>

  <form class="field" id="f" onsubmit="return false">
    <textarea id="t" aria-label="Your sentence" placeholder="i feel so happy today…"></textarea>
    <button id="go" type="button">Read it</button>
  </form>

  <div class="status"><span class="verdict" id="v">Waiting for a sentence</span><span id="m">Demo mode</span></div>

  <div class="stage" id="stage">
    <div class="card light" id="card">
      <div class="fill" id="fill"></div>
      <div class="row"><span id="label">Waiting…</span><span id="pct"></span></div>
    </div>
  </div>
</main>
<script>
// Set this to your Flask endpoint, e.g. "https://your-app.onrender.com/predict".
// It must accept POST {"text": "..."} and return {"probs": {"joy": 0.62, "love": 0.1, ...}}
var API_URL = "/predict";

var EMO = {
  joy:      {c:"#7BBDE8", dark:false},
  love:     {c:"#BDD8E9", dark:false},
  surprise: {c:"#6EA2B3", dark:true},
  fear:     {c:"#4E8EA2", dark:true},
  sadness:  {c:"#49769F", dark:true},
  anger:    {c:"#0A4174", dark:true}
};
var LEX = {
  joy:"happy glad joy joyful excited great wonderful fun cheerful delighted proud grateful good amazing smile laugh enjoy pleased",
  love:"love loved loving adore caring affection sweet dear fond warm kind romantic tender cherish hug",
  surprise:"surprised shocked amazed astonished unexpected suddenly wow stunned strange weird curious sudden unbelievable",
  fear:"afraid scared fear terrified anxious worried nervous panic dread frightened unsafe threatened shaking nightmare",
  sadness:"sad unhappy lonely cry crying hopeless depressed miserable hurt grief lost empty tired down heartbroken",
  anger:"angry mad furious hate annoyed irritated rage grouchy bitter outraged jealous frustrated resentful"
};
var W = {};
Object.keys(LEX).forEach(function(k){ LEX[k].split(" ").forEach(function(w){ W[w] = k; }); });

var card = document.getElementById("card"),
    fill = document.getElementById("fill"),
    label = document.getElementById("label"),
    pct = document.getElementById("pct"),
    verdict = document.getElementById("v"),
    mode = document.getElementById("m"),
    stage = document.getElementById("stage");

function demo(text){
  var s = {}, sum = 0, k;
  Object.keys(EMO).forEach(function(e){ s[e] = 0.25; });
  (text.toLowerCase().match(/[a-z']+/g) || []).forEach(function(w){ if (W[w]) s[W[w]] += 2; });
  for (k in s){ s[k] = Math.pow(s[k], 1.6); sum += s[k]; }
  for (k in s) s[k] /= sum;
  return s;
}

function predict(text){
  var ctl = new AbortController(), to = setTimeout(function(){ ctl.abort(); }, 1500);
  return fetch(API_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text:text}), signal:ctl.signal})
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(j){ clearTimeout(to); mode.textContent = "Model connected"; return j.probs; })
    .catch(function(){ clearTimeout(to); mode.textContent = "Demo mode"; return demo(text); });
}

function show(probs){
  var top = Object.keys(probs).sort(function(a,b){ return probs[b] - probs[a]; })[0];
  var e = EMO[top] || EMO.joy;
  card.style.background = e.c;
  card.className = "card " + (e.dark ? "dark" : "light");
  label.textContent = top;
  pct.textContent = Math.round(probs[top] * 100) + "%";
  fill.style.width = (probs[top] * 100) + "%";
  verdict.textContent = "Detected emotion";
}

function run(){
  var text = document.getElementById("t").value.trim();
  if (!text){ verdict.textContent = "Type a sentence first"; return; }
  predict(text).then(show);
}
document.getElementById("go").onclick = run;
document.getElementById("t").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); run(); }
});

// pointer tilt
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  stage.addEventListener("pointermove", function(e){
    var r = stage.getBoundingClientRect(),
        x = (e.clientX - r.left) / r.width - .5,
        y = (e.clientY - r.top) / r.height - .5;
    card.style.transform = "rotateX(" + (-y * 18) + "deg) rotateY(" + (x * 14) + "deg) translateZ(20px)";
  });
  stage.addEventListener("pointerleave", function(){ card.style.transform = ""; });
}
</script>
</body>
</html>
